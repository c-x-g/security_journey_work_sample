<!DOCTYPE html>
<html>
<head>
  <meta name="generator" content=
  "HTML Tidy for HTML5 for Linux version 5.7.45">
  <title>IDOR Frontend Demo</title>
  <style>
    body { margin: 25% 0 0 50%};
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const app = document.getElementById('app');
    let username = ''
    const usernames = ['Bob', 'Alice']
    
    let loginText = "Please login" 

    function render() {
      username = localStorage.getItem('username');
      if (username && usernames.includes(username)) {
        app.innerHTML = `
          <h1>Welcome, ${username}!</h1>
          <button onclick="getDocument()">View Personal Information</button>
          <button onclick="logout()">Logout</button>
        `;
      } else {
          if (username) loginText = `${username} is not valid, please login with a valid username` 
        app.innerHTML = `
          <h1>${loginText}</h1>
          <input id="nameInput" placeholder="Enter your name" />
          <button onclick="login()">Login</button>
        `;
      }
    }

    function login() {
      const name = document.getElementById('nameInput').value.trim();
      if (name) {
        localStorage.setItem('username', name);
        render();
      }
    }

    function logout() {
      localStorage.removeItem('username');
        username = ''
        loginText = "Please login"
      render();
    }

    function getDocument() {
        const url = window.location.origin
        fetch(`${url}/documents?name=${username}`).then(res => {
            res.json().then(res => {
      Object.keys(res).forEach(key=> {
        const li = document.createElement('li');
                    li.setAttribute("style", "list-style-type:none;")
          li.textContent = `${key}: ${res[key]}`;
        app.appendChild(li);
      });
            })
        })
    }

    // Initial render
    render();
  </script>
</body>
</html>
